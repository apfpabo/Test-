<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=IBM+Plex+Sans+Condensed:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed plotting table (canvas) with grey-steel signal panels floating over it */
:root{
  --sea:#13262e; --sea-deep:#0b1a20; --ink:#e4e7e3; --ink-dim:#9fabaa;
  --panel:#16262c; --panel-2:#1e333a; --line:#36505a; --signal:#e3b23c;
  --danger:#d9614a; --good:#7fbf8e; --blue:#7fb0dc;
  --display:'Saira Stencil One', Impact, 'Arial Narrow', sans-serif;
  --body:'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sea-deep);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer}
select{padding:4px 6px;max-width:100%}
button:hover:not(:disabled){border-color:var(--signal);color:#fff}
button:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--signal);color:#1a1404;border-color:var(--signal);font-weight:700}
button.primary:hover:not(:disabled){background:#f0c55a;color:#1a1404}
button.danger{border-color:var(--danger);color:#f2c0b4}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(var(--sea-deep),rgba(11,26,32,0));font-variant-numeric:tabular-nums;pointer-events:none}
#top .stat{display:flex;gap:6px;align-items:baseline}
#top .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
#top .v{font-family:var(--mono);font-size:14px}
#top .btns{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
#top .btns button{padding:4px 10px;font-size:13px}
#top .seg{display:flex}
#top .seg button{border-radius:0;margin-left:-1px;min-width:34px;font-family:var(--mono)}
#top .seg button:first-child{border-radius:3px 0 0 3px}
#top .seg button:last-child{border-radius:0 3px 3px 0}
#top button.on{background:var(--signal);color:#1a1404;border-color:var(--signal)}
#panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,12,16,.6)}
#panel .card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--signal);border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5);width:min(940px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px 24px}
#panel h1,#panel h2{font-family:var(--display);font-weight:400;margin:0 0 4px;text-wrap:balance;letter-spacing:.02em}
#panel h1{font-size:52px;color:var(--signal)}
#panel h2{font-size:30px;color:var(--signal)}
#panel h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:18px 0 8px;font-weight:500}
#panel p{line-height:1.5;max-width:68ch;margin:6px 0}
.sub{color:var(--ink-dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;margin:14px 0 6px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 11px;color:var(--ink-dim)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--signal)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid rgba(54,80,90,.5);vertical-align:middle}
td.n{text-align:right;font-family:var(--mono);font-size:13px}
td .b{padding:3px 8px;font-size:13px;margin:1px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid var(--line);color:var(--ink-dim);white-space:nowrap}
.tag.cheap{color:var(--good);border-color:var(--good)}
.tag.dear{color:var(--danger);border-color:var(--danger)}
.tag.sig{color:var(--signal);border-color:var(--signal)}
.bar{height:6px;background:#0a171b;border-radius:2px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--good)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.cardbtn{text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px}
.cardbtn b{font-family:var(--display);font-size:20px;color:var(--signal);font-weight:400}
.cardbtn span{color:var(--ink-dim);font-size:14px;line-height:1.4}
.tile{border:1px solid var(--line);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel-2)}
.tile b{font-size:16px}
.tile.done{border-color:var(--good)}
.tile.lock{opacity:.55}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:1px 6px;background:var(--panel-2)}
.shipimg{display:block;max-width:100%;height:auto}
#toasts{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(440px,calc(100% - 28px))}
#toasts div{background:rgba(22,38,44,.94);border-left:3px solid var(--signal);padding:7px 12px;border-radius:2px;font-size:14px;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#touch{position:fixed;inset:auto 0 calc(10px + env(safe-area-inset-bottom,0px)) 0;display:flex;justify-content:space-between;padding:0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
#touch .pad{display:grid;grid-template-columns:repeat(3,54px);gap:6px;pointer-events:auto}
#touch button{height:50px;padding:0;font-size:12px;background:rgba(30,51,58,.88)}
@media (prefers-reduced-motion:reduce){#toasts div{animation:none}}
</style>
</head><body>

<canvas id="cv"></canvas>
<div id="top" hidden></div>
<button id="dock" class="primary" hidden></button>
<div id="toasts"></div>
<div id="touch" hidden>
  <div class="pad">
    <span></span><button data-t="up" aria-label="Ahead faster">▲</button><span></span>
    <button data-t="left" aria-label="Rudder left">◀</button><button data-t="down" aria-label="Slower">▼</button><button data-t="right" aria-label="Rudder right">▶</button>
  </div>
  <div class="pad">
    <button data-t="fire">Guns</button><button data-t="torp">Torps</button><button data-t="msl">Missile</button>
    <button data-t="air">Strike</button><button data-t="dive">Dive</button><button data-t="ret">Retreat</button>
  </div>
</div>
<div id="panel" hidden><div class="card" id="card"></div></div>

  aoUnder(g, q => { g.beginPath(); g.ellipse(x, y, rx + q, ry + q, 0, 0, TAU); }, 0.3);
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU);
  if (HM.on) { const gr = g.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry)); gr.addColorStop(0, hgrey(h)); gr.addColorStop(0.75, hgrey(h)); gr.addColorStop(1, hgrey(h - 0.6)); g.fillStyle = gr; g.fill(); }
  else { const gr = g.createRadialGradient(x - rx * 0.1, y, 0, x, y, Math.max(rx, ry)); gr.addColorStop(0, shade(P.sup, clamp(-0.02 + h * 0.008, -0.04, 0.14) + k)); gr.addColorStop(1, shade(P.sup, clamp(-0.12 + h * 0.008, -0.12, 0.04) + k)); g.fillStyle = gr; g.fill(); g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 0.07; g.stroke(); }
}
// A rangefinder: a long tube across the ship (or at angle a) with a hood at each end.
function rangefinder(g, P, x, y, len, h, a = PI / 2) {
  g.save(); g.translate(x, y); g.rotate(a); const wd = Math.max(0.5, len * 0.075);
  rrect(g, -len / 2, -wd / 2, len, wd, wd / 2); pfill(g, shade(P.sup, -0.12), h);
  for (const sx of [-1, 1]) { rrect(g, sx * len / 2 - (sx > 0 ? wd * 1.3 : 0), -wd * 0.85, wd * 1.3, wd * 1.7, wd * 0.5); pfill(g, shade(P.sup, -0.05), h + 0.15); if (!HM.on) { g.fillStyle = 'rgba(10,12,13,.7)'; g.fillRect(sx * len / 2 - (sx > 0 ? 0.25 : -0.05) - 0.1, -wd * 0.5, 0.2, wd); } }
  g.restore();
}
// Fire-control directors, each after its nation's pattern, centred on (cx, cy).
function director(g, P, cx, cy, s, h, kind) {
  const S = P.sup; g.save(); g.translate(cx, cy);
  if (kind === 'us') { // Mk 37 / Mk 38: a box with a rounded rear, rangefinder arms through the sides, a radar antenna on top
    rangefinder(g, P, -s * 0.05, 0, s * 1.65, h - 0.4);
    aoUnder(g, k => levelPath(g, -s * 0.55, s * 0.5, s * 0.42, 'square', 'round', k), 0.2); levelPath(g, -s * 0.55, s * 0.5, s * 0.42, 'square', 'round'); pfill(g, shade(S, 0.06), h);
    rrect(g, -s * 0.1, -s * 0.38, s * 0.22, s * 0.76, s * 0.05); pfill(g, shade(S, -0.25), h + 1.2);
  } else if (kind === 'uk') { // DCT / HACS: a squarish hood with rangefinder arms
    rangefinder(g, P, -s * 0.1, 0, s * 1.5, h - 0.3);
    aoUnder(g, k => rrect(g, -s * 0.5 - k, -s * 0.42 - k, s + 2 * k, s * 0.84 + 2 * k, s * 0.12), 0.2); rrect(g, -s * 0.5, -s * 0.42, s, s * 0.84, s * 0.12); pfill(g, shade(S, 0.04), h);
    if (!HM.on) { g.fillStyle = 'rgba(10,12,13,.6)'; g.fillRect(s * 0.4, -s * 0.3, s * 0.07, s * 0.6); }
  } else if (kind === 'de' || kind === 'su') { // rotating rangefinder cupola: a dome with long arms
    rangefinder(g, P, 0, 0, s * (kind === 'de' ? 2.4 : 2.1), h - 0.3);
    cyl(g, P, 0, 0, s * 0.5, s * 0.5, h + 0.5, 0.04);
  } else if (kind === 'it') { // stacked rangefinder turrets: a rounded hood with arms
    rangefinder(g, P, -s * 0.1, 0, s * 2.2, h - 0.2);
    levelPath(g, -s * 0.55, s * 0.45, s * 0.45, 'round', 'round'); pfill(g, shade(S, 0.05), h + 0.3);
  } else if (kind === 'jp') { // a long rangefinder over a round base
    cyl(g, P, 0, 0, s * 0.55, s * 0.55, h - 0.5);
    rangefinder(g, P, -s * 0.15, 0, s * 2.6, h + 0.4);
  } else { // modern: a fire-control radar on a pedestal
    cyl(g, P, 0, 0, s * 0.4, s * 0.4, h - 0.6);
    g.beginPath(); g.ellipse(s * 0.1, 0, s * 0.18, s * 0.5, 0, 0, TAU); pfill(g, shade(S, 0.25), h + 0.6);
  }

}
function searchlight(g, P, x, y, h) {
  g.beginPath(); g.arc(x, y, 0.55, 0, TAU); pfill(g, shade(P.sup, -0.05), h);
  if (!HM.on) { g.beginPath(); g.arc(x + 0.08, y, 0.36, 0, TAU); g.fillStyle = '#c9ccc6'; g.fill(); g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 0.05; g.stroke(); }
}
function tub(g, P, x, y, r, h) { // an AA tub: a ring of plating round the gun
  aoUnder(g, k => { g.beginPath(); g.arc(x, y, r + k, 0, TAU); }, 0.2);
  g.beginPath(); g.arc(x, y, r, 0, TAU); pfill(g, shade(P.sup, -0.02), h);
  g.beginPath(); g.arc(x, y, r * 0.78, 0, TAU);
  if (HM.on) pfill(g, null, h - 0.8);
  else { g.fillStyle = shade(P.deck, -0.2); g.fill(); g.fillStyle = shade(P.sup, -0.3); g.fillRect(x - r * 0.1, y - r * 0.5, r * 0.85, r * 0.12); g.fillRect(x - r * 0.1, y + r * 0.38, r * 0.85, r * 0.12); g.beginPath(); g.arc(x - r * 0.15, y, r * 0.3, 0, TAU); g.fill(); }
}
// Half-beam of the hull at x, for keeping wings and platforms over the deck.
function halfBeamAt(d, x) { const h = d.L / 2, fe = (d.p.bow || .33) * d.L, fr = (d.p.run || .2) * d.L; let half = d.B / 2;

// Faceted, slab-sided structures of the stealth designs (Era IV; the owner, 13 Nov 2026: they looked like ordinary ships).
// A block is a base polygon and a smaller roof polygon above it, so every side is a flat plate leaning inboard. In height
// mode the slope is laid in steps between the two, and Godot lights each plate from the sun as it does everything else.
function facet(g, P, base, roof, h0, h1, o = {}) {
  const S = o.col || P.sup, n = base.length, poly = pts => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
  const mix = k => base.map(([x, y], i) => [x + (roof[i][0] - x) * k, y + (roof[i][1] - y) * k]);
  if (HM.on) { const steps = 64; for (let i = 0; i <= steps; i++) { poly(mix(i / steps)); pfill(g, null, h0 + (h1 - h0) * i / steps); } return; }
  if (!o.noAo) aoUnder(g, k => poly(base.map(([x, y]) => [x + Math.sign(x - (base[0][0] + base[n >> 1][0]) / 2) * k, y + Math.sign(y) * k])), 0.4);
  poly(base); g.fillStyle = shade(S, -0.1 + (o.lift || 0)); g.fill(); g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 0.1; g.stroke();
  poly(roof); g.fillStyle = shade(S, 0.03 + (o.lift || 0)); g.fill(); g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 0.08; g.stroke();
  g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = 0.07; g.beginPath(); for (let i = 0; i < n; i++) { g.moveTo(base[i][0], base[i][1]); g.lineTo(roof[i][0], roof[i][1]); } g.stroke();   // the creases between plates
}
// An eight-sided block lying fore and aft: x0 aft, x1 forward, half-width hw, the corners cut by c; `k` narrows the ends.
function oct(x0, x1, hw, c, kf = 0.55, ka = 0.7, y = 0) { return [[x0, y - hw * ka], [x0 + c, y - hw], [x1 - c, y - hw], [x1, y - hw * kf], [x1, y + hw * kf], [x1 - c, y + hw], [x0 + c, y + hw], [x0, y + hw * ka]]; }
function facetBlock(g, P, x0, x1, hw, h0, h1, o = {}) {
  const c = Math.min((x1 - x0) * 0.22, hw * 0.9), ins = (h1 - h0) * (o.slope || 0.34), y = o.y || 0;
  const base = oct(x0, x1, hw, c, o.kf, o.ka, y), roof = oct(x0 + ins * 1.3, x1 - ins * 1.6, Math.max(0.4, hw - ins), Math.max(0.2, c - ins * 0.3), o.kf, o.ka, y);
  facet(g, P, base, roof, h0, h1, o);
  return { x0: x0 + ins * 1.3, x1: x1 - ins * 1.6, hw: Math.max(0.4, hw - ins), base, roof };
}
// The upper works of a stealth design, from the same plan fields as any other: each `sup` block a faceted deckhouse

function yardOf(p) {

  return YARDS[p.fac].filter(c => c !== 'bb' && c !== 'cv' || p.capital).flatMap(c => (DESIGNS_OF[c] || []).filter(id => makers.includes(HULLS[id].yard) && designOK(id, G.tech)))

}

    ctx.fillStyle = 'rgba(14,26,30,.9)'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = 'rgba(227,178,60,.55)'; ctx.strokeRect(x + 0.5, y + 0.5, w, h);
    ctx.fillStyle = '#e3b23c'; ctx.font = '20px "Saira Stencil One", Impact, sans-serif'; ctx.fillText(s.rec.name.toUpperCase(), x + 10, y + 7);
    ctx.fillStyle = '#9fabaa'; ctx.font = '12px "IBM Plex Sans Condensed", sans-serif';
    const hdg = Math.round(((s.a + PI / 2) / TAU * 360 % 360 + 360) % 360), rud = Math.round(s.rud * 35);
    ctx.fillText(s.def.dn + ' class · ' + ['All stop', 'Slow ahead', 'Half ahead', 'Full ahead', 'Flank speed'][s.throttle] + ' · ' + Math.round(s.v / KN) + ' kn · course ' + String(hdg).padStart(3, '0') + '° · rudder ' + (rud ? Math.abs(rud) + '° ' + (rud < 0 ? 'port' : 'stbd') : 'amidships') + (s.sub ? (submerged(s) ? ' · SUBMERGED' : s.wantDive ? ' · diving' : ' · surfaced') : ''), x + 10, y + 32);
    ctx.fillText('Hull', x + 10, y + 52); bar(x + 60, y + 54, 330, 7, s.hull / s.maxHull, '#7fbf8e');
    ctx.fillText('Armour', x + 10, y + 66); bar(x + 60, y + 68, 330, 5, s.armor / Math.max(1, s.def.armor), '#9fabaa');
    const groups = {}; for (const m of s.mounts) { const k = m.w.name; (groups[k] = groups[k] || []).push(m); }
    let gx = x + 10, gy = y + 84;
    for (const [n, ms] of Object.entries(groups)) {
      const w0 = ms[0].w; const ready = ms.filter(m => m.cd <= 0).length;
      ctx.fillStyle = '#d6dcda'; ctx.fillText(ms.length + '× ' + n, gx, gy);
      bar(gx, gy + 15, 120, 3, ready / ms.length, ready ? '#7fbf8e' : '#e3b23c');
      gx += 190; if (gx > x + 300) { gx = x + 10; gy += 22; }
      if (gy > y + h - 16) break;
    }
    if (s.squads.length) { ctx.fillStyle = '#d6dcda'; ctx.textAlign = 'right'; ctx.fillText('Air: ' + s.squads.map(q => q.state === 'ready' ? '▲' + q.n : q.state === 'out' ? '→' : q.state === 'rearm' ? '…' : '✕').join(' '), x + w - 10, y + 7); ctx.textAlign = 'left'; }
  }
  // minimap
  const mw = 190, mh = mw * C.AH / C.AW, mx = W - mw - 16, my = H - mh - 16 - pad;
  ctx.fillStyle = 'rgba(14,26,30,.9)'; ctx.fillRect(mx, my, mw, mh); ctx.strokeStyle = 'rgba(227,178,60,.55)'; ctx.strokeRect(mx + 0.5, my + 0.5, mw, mh);
  const k = mw / C.AW;
  ctx.fillStyle = '#56703f'; for (const is of C.islands) { ctx.beginPath(); ctx.arc(mx + is.x * k, my + is.y * k, is.r * k, 0, TAU); ctx.fill(); }
  for (const sh of C.ships) { if (!active(sh) || (sh.side === 1 && !visibleTo(sh, 0))) continue; ctx.fillStyle = sh === C.flag ? '#e3b23c' : sh.side ? '#d9614a' : '#7fbf8e'; const r = clamp(sh.def.L / 60, 2, 5); ctx.fillRect(mx + sh.x * k - r / 2, my + sh.y * k - r / 2, r, r); }
  for (const q of C.air) { ctx.fillStyle = q.side ? '#f2c0b4' : '#f3e2a8'; ctx.fillRect(mx + q.x * k - 1, my + q.y * k - 1, 2, 2); }
  ctx.strokeStyle = 'rgba(228,231,227,.4)'; ctx.strokeRect(mx + (C.cam.x - W / 2 / C.zoom) * k, my + (C.cam.y - H / 2 / C.zoom) * k, W / C.zoom * k, H / C.zoom * k);
  C.msgT -= rdt; // messages fade on the real clock, whatever the battle speed
  if (C.msgT > 0) { ctx.fillStyle = 'rgba(228,231,227,' + Math.min(1, C.msgT) + ')'; ctx.font = '26px "Saira Stencil One", Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(C.msg.toUpperCase(), W / 2, 60); }
  if (C.paused) { ctx.fillStyle = 'rgba(4,12,16,.5)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#e4e7e3'; ctx.font = '34px "Saira Stencil One", Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('PAUSED · P TO RESUME', W / 2, H / 2); }
}

/* ================================================================ input */
function lockAtMouse() {
  const m = mouseWorld(); let best = null, bd = Infinity;
  for (const o of C.ships) { if (o.side !== 1 || !engageable(o) || !visibleTo(o, 0)) continue; const d = dist(o.x, o.y, m.x, m.y); if (d < Math.max(30 / C.zoom, o.def.L * 0.6) && d < bd) { bd = d; best = o; } }
  if (best) { C.lock = best; C.autofire = true; say('Main battery: engage ' + best.rec.name + '!', 1.6); }
  return best;
}
function combatKey(code) {
  const s = C.flag; if (!s) return;
  if ((code === 'KeyW' || code === 'ArrowUp')) s.throttle = Math.min(4, s.throttle + 1);
  if ((code === 'KeyS' || code === 'ArrowDown')) s.throttle = Math.max(0, s.throttle - 1);

  if (code === 'KeyQ') { C.wantMsl = true; if (!hasKind(s, 'ssm')) say('No missile launchers on this ship.', 1.2); }
  if (code === 'KeyF') { if (!s.squads.length) say('This ship carries no aircraft.', 1.2); else if (!launchStrike(s, C.lock && engageable(C.lock) ? C.lock : nearestEnemyShip({ x: mouseWorld().x, y: mouseWorld().y, side: 0 }, 99999, o => !submerged(o)))) say('No squadrons ready.', 1.2); }
  if (code === 'KeyC') { if (s.sub) { s.wantDive = !s.wantDive; say(s.wantDive ? 'Dive, dive, dive!' : 'Surfacing.', 1.2); } }

  if (code === 'KeyR') lockAtMouse();
  if (code === 'Digit1') C.order = 'engage';
  if (code === 'Digit2') C.order = 'escort';
  if (code === 'Digit3') { C.order = 'retreat'; say('All ships withdraw! Open the range and break contact.', 2.5); }
  if (code === 'KeyP' || code === 'Escape') C.paused = !C.paused;
  if (code === 'Home' || code === 'Space') { C.free = false; say('Camera on the ' + (C.flag ? C.flag.rec.name : 'flagship') + '.', 1); }
  if (code === 'Equal' || code === 'NumpadAdd' || code === 'Period') { combatSpeed = Math.min(8, combatSpeed * 2); say('Time ×' + combatSpeed * BT, 1); }
  if (code === 'Minus' || code === 'NumpadSubtract' || code === 'Comma') { combatSpeed = Math.max(0.5, combatSpeed / 2); say('Time ×' + combatSpeed * BT + (combatSpeed < 1 ? ' (real time)' : ''), 1); }
  if (code === 'Tab') { const mine = C.ships.filter(x => x.side === 0 && engageable(x)); if (mine.length > 1) { C.flag = mine[(mine.indexOf(C.flag) + 1) % mine.length]; say('You take command of the ' + C.flag.rec.name + '.', 1.5); } }
}
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  keys[e.code] = true;
  if (mode === 'combat' && C) {
    if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.repeat) return; initAudio(); combatKey(e.code);
  } else if (mode === 'map' && G) {
    if (e.code === 'Space' && !panelOpen) { e.preventDefault(); G.paused = !G.paused; }
    if (!panelOpen) {
      const sp = { Digit1: 1, Digit2: 2, Digit3: 4, Digit4: 8 }[e.code]; if (sp) { mapSpeed = sp; G.paused = false; }
      if (e.code === 'KeyC' || e.code === 'Home') mapView.free = false;
      if (e.code === 'Equal' || e.code === 'NumpadAdd') mapZoom = clamp(mapZoom * 1.25, 0.14, 14);
      if (e.code === 'Minus' || e.code === 'NumpadSubtract') mapZoom = clamp(mapZoom / 1.25, 0.14, 14);
    }
    if (e.code === 'Escape' && panelOpen && !lastResultOpen()) act('leave', {});
  }
});
function lastResultOpen() { return !!$('#card [data-act="aftermathdone"]') || !!$('#card [data-act="engage"]'); }
window.addEventListener('keyup', e => { keys[e.code] = false; });
cvs.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('pointerup', () => { mouse.down = false; });
let camDrag = null; // right- or middle-button drag pans the battle chart
cvs.addEventListener('pointerdown', e => {
  initAudio(); mouse.x = e.clientX; mouse.y = e.clientY;
  if (mode === 'combat' && C && (e.button === 1 || e.button === 2) && e.pointerType !== 'touch') { e.preventDefault(); camDrag = { x: e.clientX, y: e.clientY, cx: C.cam.x, cy: C.cam.y, moved: false, button: e.button }; return; }
  if (mode === 'combat' && C) {
    if (e.pointerType === 'touch') { lockAtMouse(); return; }
    if (!lockAtMouse()) mouse.down = true; return; // click an enemy to engage it; hold on open water to fire at that spot
  }
  if (mode !== 'map' || panelOpen) return;
  mapDrag = { x: e.clientX, y: e.clientY, vx: mapCam ? mapCam.x : G.player.x, vy: mapCam ? mapCam.y : G.player.y, moved: false };
});
window.addEventListener('pointermove', e => {
  if (camDrag && C) { const dx = e.clientX - camDrag.x, dy = e.clientY - camDrag.y; if (!camDrag.moved && Math.hypot(dx, dy) < 6) return; camDrag.moved = true; C.free = true;
    C.cam.x = clamp(camDrag.cx - dx / C.zoom, 0, C.AW); C.cam.y = clamp(camDrag.cy - dy / C.zoom, 0, C.AH); return; }
  if (!mapDrag || mode !== 'map') return;
  const dx = e.clientX - mapDrag.x, dy = e.clientY - mapDrag.y;
  if (!mapDrag.moved && Math.hypot(dx, dy) < 6) return;
  mapDrag.moved = true; mapView.free = true;
  mapView.x = wrapX(mapDrag.vx - dx / mapZoom); mapView.y = clamp(mapDrag.vy - dy / mapZoom, 0, MH);
});
window.addEventListener('pointerup', e => {
  if (camDrag) { const cd = camDrag; camDrag = null; if (!cd.moved && cd.button === 2 && C) { if (!lockAtMouse() && (C.lock || C.autofire)) { C.lock = null; C.autofire = false; say('Check fire.', 1.4); } } return; }
  const d = mapDrag; mapDrag = null;
  if (!d || d.moved || mode !== 'map' || panelOpen || e.target !== cvs) return;
  mapClick(e.clientX, e.clientY);
});
function mapClick(cx, cy) {
  const P = G.player; const cam = mapCam || { x: P.x, y: P.y }; const wx = wrapX((cx - W / 2) / mapZoom + cam.x), wy = (cy - H / 2) / mapZoom + cam.y;
  const near = (x, y, r) => mdist(x, y, wx, wy) < r / Math.min(mapZoom, 1.5);
  P.destPort = null; P.follow = null; G.paused = false;
  const boost = mapZoom > 1 ? Math.pow(mapZoom, 0.75) : 1;
  for (const f of G.fleets) if (near(f.x, f.y, 16 * boost)) { P.follow = f.id; P.repathT = 0; f.cool = 0; toast('Intercept course locked on the ' + f.name.toLowerCase() + '. You will close and make contact.'); return; }
  for (const p of G.ports) if (near(p.x, p.y, 14) || near(p.sx, p.sy, 10)) { if (mdist(p.sx, p.sy, P.x, P.y) < 28) { openPort(p); return; } P.destPort = p.id; if (!setCourse(P, p.sx, p.sy)) { P.tx = null; toast('No sea route to ' + p.name + '.'); } return; }
  for (const q of G.pois) if (near(q.x, q.y, 12)) { if (mdist(q.x, q.y, P.x, P.y) < 22) { openSurvey(q); return; } setCourse(P, q.x, q.y); return; }
  if (onLand(wx, wy)) { toast('That is land. Pick a point on the water.'); return; }
  if (!setCourse(P, wx, clamp(wy, 4, MH - 4))) { P.tx = null; toast('No sea route to that point.'); }
}
cvs.addEventListener('wheel', e => {
  e.preventDefault(); const f = Math.exp(-e.deltaY * 0.0012);
  if (mode === 'combat' && C) { // zoom about the cursor
    const before = mouseWorld(); C.zoom = clamp(C.zoom * f, 0.035, 2.5); const after = mouseWorld();
    if (C.free) { C.cam.x += before.x - after.x; C.cam.y += before.y - after.y; } }
  else if (mode === 'map') mapZoom = clamp(mapZoom * f, 0.14, 14);
}, { passive: false });
document.querySelectorAll('#touch button').forEach(b => {
  const t = b.dataset.t;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio(); if (!C) return;
    if (t === 'left' || t === 'right') touchHeld[t] = true;
    if (t === 'fire') { C.autofire = true; if (!C.lock) { C.lock = nearestEnemyShip(C.flag || { x: 0, y: 0, side: 0 }); } }
    ({ up: 'KeyW', down: 'KeyS', torp: 'KeyT', msl: 'KeyQ', air: 'KeyF', dive: 'KeyC', ret: 'Digit3' }[t] && combatKey({ up: 'KeyW', down: 'KeyS', torp: 'KeyT', msl: 'KeyQ', air: 'KeyF', dive: 'KeyC', ret: 'Digit3' }[t]));
  });
  const up = () => { touchHeld[t] = false; };
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});

/* ================================================================ loop & boot */
let last = performance.now();
let rdt = 0.016; // real seconds since the last frame
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; tNow += dt; rdt = dt;
  if (mode === 'map' && G && !panelOpen) {
    const px = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0), py = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (px || py) { if (!mapView.free) { mapView.x = G.player.x; mapView.y = G.player.y; } mapView.free = true; mapView.x = wrapX(mapView.x + px * 600 * dt / mapZoom); mapView.y = clamp(mapView.y + py * 600 * dt / mapZoom, 0, MH); }
  }
  try {
    if (mode === 'combat' && C) { const n = Math.max(1, Math.round(combatSpeed)), sub = Math.ceil(dt * BT * Math.min(1, combatSpeed) / 0.04); for (let i = 0; i < n * sub && C; i++) updateCombat(dt * Math.min(1, combatSpeed) / sub); if (C) renderCombat(); }
    else if (G && (mode === 'map' || mode === 'over')) { if (mode === 'map') for (let i = 0; i < mapSpeed && mode === 'map' && !panelOpen; i++) updateMap(dt); renderMap(); }
    else renderTitleBg();
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
let titleFleet = null;
function renderTitleBg() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#163a44'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); drawWaves(0, tNow * 10, 1, 0.1); ctx.restore();
  if (!titleFleet) titleFleet = ['bb_iowa', 'ca_baltimore', 'dd_fletcher', 'dd_fletcher', 'cl_cleveland'].map((t, i) => ({ type: t, x: -200 - i * 330, y: H * 0.5 + (i % 2 ? 90 : -40) + i * 10 }));
  for (const f of titleFleet) { f.x += 0.35; if (f.x > W + 300) f.x = -300; drawSpriteAt(f.type, 'concord', f.x, f.y, 0, 1.1, 0.55, true); }
}
function start(data) {
  buildLand(); buildNav();
  if (data && data.G && data.G.v !== 2) data = {};
  if (data && data.G) { G = data.G; migrateSave(); mode = 'map'; $('#top').hidden = false; closePanel(); toast('The chart has been redrawn. Your campaign continues.'); }
  else showTitle();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => (G && mode === 'map') ? { G } : {});
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
