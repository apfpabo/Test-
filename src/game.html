<title>Broadside Reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed canvas (chart table) with brass-and-parchment panels floating above it */
:root{
  --sea:#0e3039; --sea-deep:#0a242c; --ink:#eadfc4; --ink-dim:#b6ab92;
  --panel:#122a30; --panel-2:#183840; --line:#355a5e; --brass:#d6a14a;
  --danger:#d0644b; --good:#86bd8f;
  --display:'IM Fell English SC', Georgia, 'Times New Roman', serif;
  --body:'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sea-deep);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--brass);color:#fff}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--brass);color:#1b1408;border-color:var(--brass);font-weight:700}
button.primary:hover:not(:disabled){background:#e8b862;color:#1b1408}
button.danger{border-color:var(--danger);color:#f3c2b6}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(var(--sea-deep),rgba(10,36,44,0));font-variant-numeric:tabular-nums;pointer-events:none}
#top .stat{display:flex;gap:6px;align-items:baseline}
#top .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
#top .v{font-weight:700}
#top .btns{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
#top .btns button{padding:4px 10px;font-size:13px}
#panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,18,22,.55)}
#panel .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);width:min(860px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px 24px}
#panel h1,#panel h2{font-family:var(--display);font-weight:400;margin:0 0 4px;text-wrap:balance}
#panel h1{font-size:44px;color:var(--brass);letter-spacing:.02em}
#panel h2{font-size:28px;color:var(--brass)}
#panel h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:18px 0 8px;font-weight:500}
#panel p{line-height:1.5;max-width:65ch;margin:6px 0}
.sub{color:var(--ink-dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 4px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--ink-dim)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brass)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(53,90,94,.45);vertical-align:middle}
td.n{text-align:right}
td .b{padding:3px 8px;font-size:13px;margin:1px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--ink-dim)}
.tag.cheap{color:var(--good);border-color:var(--good)}
.tag.dear{color:var(--danger);border-color:var(--danger)}
.bar{height:6px;background:#0b1e22;border-radius:3px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--good)}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.start{text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px}
.start b{font-family:var(--display);font-size:20px;color:var(--brass);font-weight:400}
.start span{color:var(--ink-dim);font-size:14px;line-height:1.4}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
kbd{font-family:var(--body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:1px 6px;background:var(--panel-2)}
#toasts{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(420px,calc(100% - 28px))}
#toasts div{background:rgba(18,42,48,.92);border-left:3px solid var(--brass);padding:7px 12px;border-radius:3px;font-size:14px;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#touch{position:fixed;inset:auto 0 calc(10px + env(safe-area-inset-bottom,0px)) 0;display:flex;justify-content:space-between;padding:0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
#touch .pad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;pointer-events:auto}
#touch button{height:52px;padding:0;font-size:13px;background:rgba(24,56,64,.85)}
@media (prefers-reduced-motion:reduce){#toasts div{animation:none}}
</style>

<canvas id="cv"></canvas>
<div id="top" hidden></div>
<button id="dock" class="primary" hidden></button>
<div id="toasts"></div>
<div id="touch" hidden>
  <div class="pad">
    <span></span><button data-t="up" aria-label="More sail">▲</button><span></span>
    <button data-t="left" aria-label="Turn to port">◀</button><button data-t="down" aria-label="Less sail">▼</button><button data-t="right" aria-label="Turn to starboard">▶</button>
  </div>
  <div class="pad">
    <button data-t="port">Port</button><button data-t="bow">Bow</button><button data-t="star">Stbd</button>
    <button data-t="o1">Engage</button><button data-t="o2">Escort</button><button data-t="o3">Retreat</button>
  </div>
</div>
<div id="panel" hidden><div class="card" id="card"></div></div>

<script>
'use strict';
/* ============================== utilities ============================== */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = Math.random;
const ri = (a, b) => Math.floor(a + R() * (b - a + 1));
const pick = arr => arr[Math.floor(R() * arr.length)];
const fmt = n => Math.round(n).toLocaleString('en-US');
const hash2 = (i, j) => (((i * 73856093) ^ (j * 19349663)) >>> 0);
function shuffle(a, r = R) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ============================== data ============================== */
const GOODS = [
  { id: 'prov', name: 'Provisions', base: 12 },
  { id: 'timber', name: 'Timber', base: 30 },
  { id: 'cloth', name: 'Sailcloth', base: 44 },
  { id: 'rum', name: 'Rum', base: 55 },
  { id: 'powder', name: 'Gunpowder', base: 78 },
  { id: 'spice', name: 'Spice', base: 115 },
];
const HULLS = {
  cutter:     { name: 'Cutter',          cls: 'Light',   len: 66,  beam: 21, hull: 320,  armor: 30,  speed: 128, turn: 1.9,  cargo: 30,  price: 3500,  guns: 2,  gun: 'light', bow: true,  masts: 1, upkeep: 0.4 },
  sloop:      { name: 'Sloop of War',    cls: 'Light',   len: 84,  beam: 26, hull: 480,  armor: 50,  speed: 116, turn: 1.55, cargo: 45,  price: 7500,  guns: 3,  gun: 'light', bow: true,  masts: 1, upkeep: 0.6 },
  fluyt:      { name: 'Fluyt',           cls: 'Medium',  len: 111,  beam: 36, hull: 700,  armor: 50,  speed: 88,  turn: 0.95, cargo: 260, price: 12000, guns: 2,  gun: 'light', bow: false, masts: 3, upkeep: 0.9 },
  brig:       { name: 'Brig',            cls: 'Medium',  len: 105,  beam: 32, hull: 780,  armor: 80,  speed: 102, turn: 1.2,  cargo: 80,  price: 15000, guns: 5,  gun: 'med',   bow: true,  masts: 2, upkeep: 1.0 },
  frigate:    { name: 'Frigate',         cls: 'Heavy',   len: 138,  beam: 38, hull: 1250, armor: 120, speed: 97,  turn: 0.95, cargo: 120, price: 32000, guns: 8,  gun: 'med',   bow: true,  masts: 3, upkeep: 1.6 },
  ironclad:   { name: 'Ironclad Ram',    cls: 'Heavy',   len: 126,  beam: 39, hull: 1900, armor: 280, speed: 82,  turn: 0.85, cargo: 60,  price: 58000, guns: 3,  gun: 'heavy', bow: true,  masts: 0, upkeep: 2.2, steam: true, ram: true },
  lineship:   { name: 'Ship of the Line',cls: 'Capital', len: 183, beam: 50, hull: 2900, armor: 180, speed: 72,  turn: 0.55, cargo: 180, price: 85000, guns: 13, gun: 'med',   bow: true,  masts: 3, upkeep: 3.0 },
};
const GUNS = {
  light: { name: '6-pounders',  dmg: 28,  range: 380, reload: 3.2, speed: 560, spread: 0.06 },
  med:   { name: '18-pounders', dmg: 45,  range: 430, reload: 4.2, speed: 580, spread: 0.05 },
  heavy: { name: 'Rifled 9-inch', dmg: 110, range: 500, reload: 5.5, speed: 640, spread: 0.03 },
  bow:   { name: 'Bow chaser',  dmg: 22,  range: 480, reload: 2.4, speed: 640, spread: 0.03 },
};
const SHIP_NAMES = ['Gannet','Resolute','Marigold','Kestrel','Saltpenny','Wren','Valiant','Osprey','Harrow','Dauntless','Lark','Tempest','Cormorant','Bramble','Halcyon','Merrow','Tern','Constance','Thrift','Ardent','Bellwether','Petrel','Sable Rose','Fortitude','Quillon','Starling'];
const PIRATE_NAMES = ['Black Moth','Cutthroat Jenny','Gallows Bird','Red Tide','Ravener','Scourge','Widow\'s Due','Rattlebones','Hangman\'s Luck','Bilge Rat','Grinning Meg','Carrion','Salt Wraith','Dead Reckoning'];
const CAPTAINS = ['"Hook-Eye" Marlowe','Ysolde Crane','"Bosun" Teague','Anika Vell','Black Corwin','Mother Grist','"Lantern" Pike','Severin Oakes'];
const PORT_NAMES = ['Port Calloway','Saltmere','Greyhaven Roads','Ambergris Key','Tallow Point','Sorrow\'s Cay','Blackwater Hole'];
const SHIP_ORDER = ['cutter','sloop','fluyt','brig','frigate','ironclad','lineship'];
const MW = 3600, MH = 2400;
const SAVE_KEY = 'broadside-reach-save-v1';

/* ============================== canvas & input ============================== */
const cvs = $('#cv'), ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = cvs.clientWidth; H = cvs.clientHeight; cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR); }
window.addEventListener('resize', resize); resize();

const keys = {};
const mouse = { x: 0, y: 0 };
let G = null, mode = 'title', C = null;
let panelOpen = false, mapZoom = 0.6, tNow = 0;
const touchHeld = {};

/* ============================== sound ============================== */
let AC = null, noiseBuf = null, muted = false, lastBoom = 0;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.6, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  } catch (e) { AC = null; }
}
function boom(vol, freq = 420) {
  if (muted || !AC || vol < 0.02) return;
  const now = AC.currentTime; if (now - lastBoom < 0.035) return; lastBoom = now;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 0.7 + Math.random() * 0.4;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq + Math.random() * 200;
  const g = AC.createGain(); g.gain.value = Math.min(0.5, vol);
  s.connect(f).connect(g).connect(AC.destination); s.start(now);
}

/* ============================== world helpers ============================== */
function makeIsland(x, y, r, rand) {
  const n = 28, rad = []; const p1 = rand() * TAU, p2 = rand() * TAU, p3 = rand() * TAU;
  for (let i = 0; i < n; i++) { const t = i / n * TAU; rad.push(r * (0.78 + 0.16 * Math.sin(t * 2 + p1) + 0.1 * Math.sin(t * 5 + p2) + 0.05 * Math.sin(t * 9 + p3) + 0.06 * rand())); }
  return { x, y, r, rad };
}
function islandR(is, ang) { const n = is.rad.length; const t = (((ang % TAU) + TAU) % TAU) / TAU * n; const i = Math.floor(t) % n, f = t - Math.floor(t); return lerp(is.rad[i], is.rad[(i + 1) % n], f); }
function inIsland(is, x, y, pad = 0) { const dx = x - is.x, dy = y - is.y; const d = Math.hypot(dx, dy); if (d > is.r * 1.3 + pad) return false; return d < islandR(is, Math.atan2(dy, dx)) + pad; }
function landAt(list, x, y, pad = 0) { for (const is of list) if (inIsland(is, x, y, pad)) return is; return null; }
function islandPath(is, k = 1, pad = 0) {
  ctx.beginPath(); const n = is.rad.length;
  for (let i = 0; i <= n; i++) { const t = i / n * TAU; const r = is.rad[i % n] * k + pad; const x = is.x + Math.cos(t) * r, y = is.y + Math.sin(t) * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath();
}
function drawIsland(is, z) {
  islandPath(is, 1, 22); ctx.fillStyle = 'rgba(70,150,150,0.22)'; ctx.fill();
  islandPath(is, 1, 9); ctx.fillStyle = 'rgba(90,170,160,0.25)'; ctx.fill();
  islandPath(is, 1); ctx.fillStyle = '#cdb47e'; ctx.fill(); ctx.strokeStyle = '#8f7a4c'; ctx.lineWidth = 1.2 / z; ctx.stroke();
  islandPath(is, 0.84); ctx.fillStyle = '#5a7442'; ctx.fill();
  islandPath(is, 0.5); ctx.fillStyle = '#466036'; ctx.fill();
  islandPath(is, 0.22); ctx.fillStyle = '#6e6b52'; ctx.fill();
}
function windFactor(def, heading, wind) {
  if (def.steam) return 0.92;
  const t = (1 - Math.cos(angDiff(heading, wind.a))) / 2; // 0 running before the wind, 1 straight into it
  return (0.4 + 0.6 * (1 - t * t)) * (0.8 + 0.35 * wind.s);
}
function strength(ships) { return ships.reduce((s, sh) => s + HULLS[sh.type].price * (0.35 + 0.65 * sh.hullFrac), 0); }
function cargoCap() { return G.fleet.reduce((s, sh) => s + HULLS[sh.type].cargo, 0); }
function cargoUsed() { return GOODS.reduce((s, g) => s + Math.floor(G.cargo[g.id] || 0), 0); }
function upkeep() { return G.fleet.reduce((s, sh) => s + HULLS[sh.type].upkeep, 0); }
function newShip(type, name) { return { id: Math.random().toString(36).slice(2, 9), type, name: name || pick(SHIP_NAMES), hullFrac: 1 }; }
function waterPoint(pad = 40, near = null, rad = 0) {
  for (let i = 0; i < 200; i++) {
    let x, y;
    if (near) { const a = R() * TAU, d = R() * rad; x = near.x + Math.cos(a) * d; y = near.y + Math.sin(a) * d; }
    else { x = 120 + R() * (MW - 240); y = 120 + R() * (MH - 240); }
    if (x < 60 || y < 60 || x > MW - 60 || y > MH - 60) continue;
    if (!landAt(G.islands, x, y, pad)) return { x, y };
  }
  return { x: MW / 2, y: MH / 2 };
}

/* ============================== new game ============================== */
function genWorld(seed) {
  const rand = rng(seed); const islands = [];
  let tries = 0;
  while (islands.length < 19 && tries < 800) {
    tries++; const r = 60 + rand() * 140; const x = 220 + rand() * (MW - 440), y = 220 + rand() * (MH - 440);
    if (islands.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 150)) continue;
    islands.push(makeIsland(x, y, r, rand));
  }
  const order = shuffle(islands.map((_, i) => i), rand).slice(0, PORT_NAMES.length);
  const ports = order.map((isi, i) => {
    const is = islands[isi]; const ang = rand() * TAU; const cr = islandR(is, ang);
    const haven = i >= 5;
    const mod = {}, drift = {};
    const goods = shuffle(GOODS.filter(g => g.id !== 'prov').map(g => g.id), rand);
    const prod = goods.slice(0, 2), dem = goods.slice(2, 4);
    for (const g of GOODS) {
      let m = 0.85 + rand() * 0.35;
      if (g.id === 'prov') m = 0.8 + rand() * 0.35;
      if (prod.includes(g.id)) m = 0.5 + rand() * 0.18;
      if (dem.includes(g.id)) m = 1.4 + rand() * 0.4;
      mod[g.id] = m; drift[g.id] = 0;
    }
    let yard;
    if (haven) yard = ['cutter', 'sloop', 'brig', rand() < 0.6 ? 'frigate' : 'fluyt'];
    else {
      yard = shuffle(['cutter', 'sloop', 'fluyt', 'brig', 'frigate'], rand).slice(0, 3);
      if (i === 0) yard = ['cutter', 'sloop', 'fluyt', 'brig'];
      if (i === 2) yard.push('lineship');
      if (i === 3) yard.push('ironclad');
      yard = SHIP_ORDER.filter(t => yard.includes(t));
    }
    return { id: i, name: PORT_NAMES[i], haven, x: is.x + Math.cos(ang) * (cr + 16), y: is.y + Math.sin(ang) * (cr + 16), ang, mod, drift, yard };
  });
  return { islands, ports };
}
const STARTS = {
  privateer: { label: 'Letter of Marque', blurb: 'A Sloop of War and a Cutter, 6,000 coin. Built to hunt corsairs for bounty money.', fleet: [['sloop', 'Kestrel'], ['cutter', 'Wren']], credits: 6000, cargo: { prov: 30, powder: 10 } },
  trader: { label: 'Merchant Venture', blurb: 'A roomy Fluyt with a Cutter escort, 9,000 coin and a hold of spice. Buy low, sell high, avoid trouble.', fleet: [['fluyt', 'Marigold'], ['cutter', 'Tern']], credits: 9000, cargo: { prov: 40, spice: 20 } },
  navy: { label: 'Navy Castoff', blurb: 'A decommissioned Brig, 3,000 coin. Heavy guns and a thin purse.', fleet: [['brig', 'Ardent']], credits: 3000, cargo: { prov: 30 } },
};
function newGame(startKey) {
  const st = STARTS[startKey]; const seed = Math.floor(Math.random() * 1e9);
  const w = genWorld(seed);
  G = { seed, islands: w.islands, ports: w.ports, day: 1, dayF: 0, credits: st.credits, rep: 0,
    fleet: st.fleet.map(([t, n]) => newShip(t, n)), cargo: {}, fleets: [], wind: { a: R() * TAU, s: 0.6 }, nextId: 1, kills: 0 };
  for (const g of GOODS) G.cargo[g.id] = st.cargo[g.id] || 0;
  const p0 = G.ports[0];
  const sea = { x: p0.x + Math.cos(p0.ang) * 50, y: p0.y + Math.sin(p0.ang) * 50 };
  G.player = { x: sea.x, y: sea.y, h: p0.ang, tx: null, ty: null, cool: 3, destPort: null, follow: null };
  for (let i = 0; i < 4; i++) spawnFleet('corsair', true);
  for (let i = 0; i < 3; i++) spawnFleet('merchant', true);
  for (let i = 0; i < 2; i++) spawnFleet('bounty', true);
  closePanel(); mode = 'map'; $('#top').hidden = false;
  toast('You weigh anchor at ' + p0.name + '. Click the sea to set a course.');
  toast('Click a port to sail there and dock. Space pauses.');
  save();
}

/* ============================== map fleets ============================== */
function spawnFleet(kind, initial = false) {
  const P = G.player;
  let pos;
  for (let i = 0; i < 20; i++) {
    if (kind === 'merchant') { const lp = pick(G.ports.filter(p => !p.haven)); pos = { x: lp.x + Math.cos(lp.ang) * 40, y: lp.y + Math.sin(lp.ang) * 40, from: lp.id }; }
    else if (kind === 'corsair' && R() < 0.6) { const hv = pick(G.ports.filter(p => p.haven)); pos = waterPoint(30, hv, 500); }
    else pos = waterPoint(40);
    if (dist(pos.x, pos.y, P.x, P.y) > (initial ? 600 : 750)) break;
  }
  const f = { id: G.nextId++, kind, x: pos.x, y: pos.y, h: R() * TAU, tx: null, ty: null, cool: 0, home: { x: pos.x, y: pos.y }, ships: [], cargo: {} };
  const scale = 1 + G.day / 40;
  if (kind === 'corsair') {
    f.name = 'Corsair band';
    let budget = (5000 + R() * 9000) * scale;
    const pool = G.day > 25 ? ['cutter', 'sloop', 'brig', 'frigate', 'ironclad'] : ['cutter', 'sloop', 'sloop', 'brig', 'frigate'];
    while (budget > 3000 && f.ships.length < 6) { const opts = pool.filter(t => HULLS[t].price <= budget); if (!opts.length) break; const t = pick(opts); f.ships.push(newShip(t, pick(PIRATE_NAMES))); budget -= HULLS[t].price; }
    if (!f.ships.length) f.ships.push(newShip('cutter', pick(PIRATE_NAMES)));
  } else if (kind === 'merchant') {
    f.name = 'League convoy';
    const n = ri(1, 3); for (let i = 0; i < n; i++) f.ships.push(newShip('fluyt'));
    const esc = ri(0, 2); for (let i = 0; i < esc; i++) f.ships.push(newShip(pick(['sloop', 'brig'])));
    const dests = G.ports.filter(p => !p.haven && p.id !== pos.from); const d = pick(dests);
    f.dest = d.id; f.tx = d.x + Math.cos(d.ang) * 40; f.ty = d.y + Math.sin(d.ang) * 40;
    for (const g of GOODS) if (g.id !== 'prov' && R() < 0.5) f.cargo[g.id] = ri(10, 40) * n;
  } else {
    f.captain = pick(CAPTAINS); f.name = 'Bounty: ' + f.captain;
    let budget = (16000 + R() * 16000) * scale;
    const flag = budget > 40000 ? 'ironclad' : budget > 30000 ? 'frigate' : 'brig';
    f.ships.push(newShip(flag, pick(PIRATE_NAMES))); budget -= HULLS[flag].price;
    while (budget > 3500 && f.ships.length < 6) { const opts = ['cutter', 'sloop', 'brig', 'frigate'].filter(t => HULLS[t].price <= budget); if (!opts.length) break; const t = pick(opts); f.ships.push(newShip(t, pick(PIRATE_NAMES))); budget -= HULLS[t].price; }
    f.reward = Math.round(strength(f.ships) * 0.45 / 100) * 100;

}
function fleetMapSpeed(ships, ang) { let m = Infinity; for (const s of ships) m = Math.min(m, HULLS[s.type].speed * windFactor(HULLS[s.type], ang, G.wind) * (0.75 + 0.25 * s.hullFrac)); return m * 0.55; }
function moveOnMap(o, ang, step) {
  for (const off of [0, 0.45, -0.45, 0.9, -0.9, 1.35, -1.35]) {
    const a = ang + off; const nx = o.x + Math.cos(a) * step, ny = o.y + Math.sin(a) * step;
    if (nx < 30 || ny < 30 || nx > MW - 30 || ny > MH - 30) continue;
    if (!landAt(G.islands, nx, ny, 6)) { o.x = nx; o.y = ny; o.h = a; return true; }
  }
  return false;
}
function nearestPort(maxD) { let best = null, bd = maxD; for (const p of G.ports) { const d = dist(p.x, p.y, G.player.x, G.player.y); if (d < bd) { bd = d; best = p; } } return best; }

function newDay() {
  G.day++;
  G.cargo.prov -= upkeep();
  if (G.cargo.prov < 0) {
    G.cargo.prov = 0;
    for (const s of G.fleet) s.hullFrac = Math.max(0, s.hullFrac - 0.04);
    const lost = G.fleet.filter(s => s.hullFrac <= 0.01);
    if (lost.length) { G.fleet = G.fleet.filter(s => s.hullFrac > 0.01); toast(lost.map(s => s.name).join(', ') + ' foundered. The crew could not keep her afloat.'); }
    else toast('Provisions are gone. Hungry crews neglect the pumps and every hull suffers.');
    if (!G.fleet.length) return gameOver('Your last crew starved at sea.');
  } else if (G.cargo.prov < upkeep() * 3) toast('Provisions run low: about ' + Math.floor(G.cargo.prov / upkeep()) + ' days left.');
  for (const p of G.ports) for (const g of GOODS) p.drift[g.id] = clamp(p.drift[g.id] * 0.93 + (R() - 0.5) * 0.05, -0.3, 0.45);
  G.wind.s = clamp(G.wind.s + (R() - 0.5) * 0.25, 0.15, 1);
  G.wind.a += (R() - 0.5) * 0.7;
  const count = k => G.fleets.filter(f => f.kind === k).length;
  if (count('corsair') < 4 + Math.min(3, Math.floor(G.day / 20)) && R() < 0.45) spawnFleet('corsair');
  if (count('merchant') < 3 && R() < 0.5) spawnFleet('merchant');
  if (count('bounty') < 2 && R() < 0.15) { const f = spawnFleet('bounty'); toast('New bounty posted on ' + f.captain + ': ' + fmt(f.reward) + ' coin.'); }
}

function updateMap(dt) {
  if (panelOpen || G.paused) return;
  G.dayF += dt * 0.25;
  while (G.dayF >= 1 && mode === 'map') { G.dayF -= 1; newDay(); }
  if (mode !== 'map') return;
  G.wind.a += Math.sin(tNow * 0.05) * 0.01 * dt;
  const P = G.player; P.cool = Math.max(0, P.cool - dt);
  if (P.follow) { const f = G.fleets.find(x => x.id === P.follow); if (f) { P.tx = f.x; P.ty = f.y; } else P.follow = null; }
  if (P.tx != null) {
    const d = dist(P.x, P.y, P.tx, P.ty);
    if (d < 5) { P.tx = null; arrive(); }
    else {
      const ang = Math.atan2(P.ty - P.y, P.tx - P.x);
      const sp = fleetMapSpeed(G.fleet, ang);
      if (!moveOnMap(P, ang, Math.min(d, sp * dt))) { P.tx = null; P.destPort = null; toast('Land ahead blocks the way. Set a course around the island.'); }
      if (P.destPort != null) { const p = G.ports[P.destPort]; if (dist(P.x, P.y, p.x, p.y) < 45) { P.tx = null; arrive(); } }
    }
  }
  const ps = strength(G.fleet);
  for (const f of [...G.fleets]) {
    f.cool = Math.max(0, f.cool - dt);
    const dP = dist(f.x, f.y, P.x, P.y);
    let tx = null, ty = null, rate = 0.6;
    if (f.kind !== 'merchant' && f.cool <= 0 && P.cool <= 0 && dP < 420) {
      const fs = strength(f.ships);
      if (fs > ps * 0.55) { tx = P.x; ty = P.y; rate = 1; f.chasing = true; }
      else { tx = f.x + (f.x - P.x); ty = f.y + (f.y - P.y); rate = 0.95; f.chasing = false; }
    } else f.chasing = false;
    if (tx == null) {
      if (f.tx == null || dist(f.x, f.y, f.tx, f.ty) < 20) {
        if (f.kind === 'merchant') { G.fleets.splice(G.fleets.indexOf(f), 1); continue; }
        const w = waterPoint(30, f.home, f.kind === 'bounty' ? 320 : 600); f.tx = w.x; f.ty = w.y;
      }
      tx = f.tx; ty = f.ty;
    }
    const ang = Math.atan2(ty - f.y, tx - f.x);
    if (!moveOnMap(f, ang, fleetMapSpeed(f.ships, ang) * rate * dt)) { f.tx = null; if (f.kind === 'merchant') { G.fleets.splice(G.fleets.indexOf(f), 1); continue; } }
    if (dP < 30 && f.cool <= 0 && P.cool <= 0) { showEncounter(f); return; }
  }
  const np = nearestPort(70);
  const dock = $('#dock');
  if (np && !panelOpen) { dock.hidden = false; dock.textContent = 'Dock at ' + np.name; dock.dataset.port = np.id; } else dock.hidden = true;
}
function arrive() {
  const P = G.player;
  if (P.destPort != null) { const p = G.ports[P.destPort]; P.destPort = null; if (dist(P.x, P.y, p.x, p.y) < 70) openPort(p); }
}

/* ============================== map render ============================== */
function drawWaves(cx, cy, z, alpha) {
  const ts = 150;
  const x0 = Math.floor((cx - W / 2 / z) / ts) - 1, x1 = Math.ceil((cx + W / 2 / z) / ts) + 1;
  const y0 = Math.floor((cy - H / 2 / z) / ts) - 1, y1 = Math.ceil((cy + H / 2 / z) / ts) + 1;
  ctx.strokeStyle = 'rgba(190,230,222,' + alpha + ')'; ctx.lineWidth = 1.4 / z; ctx.beginPath();
  for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++) {
    const h = hash2(i, j); const px = i * ts + (h % 97) / 97 * ts, py = j * ts + ((h >> 8) % 89) / 89 * ts;
    const ph = Math.sin(tNow * 1.2 + (h % 628) / 100); const len = 8 + (h % 11);
    ctx.moveTo(px - len, py + ph * 2); ctx.quadraticCurveTo(px, py - 4 + ph * 2, px + len, py + ph * 2);
  }
  ctx.stroke();
}
function drawWindRose(x, y, wind, label) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(10,36,44,.75)'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(214,161,74,.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#b6ab92'; ctx.font = '10px "Alegreya Sans", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('N', 0, -25); ctx.fillText('S', 0, 25); ctx.fillText('E', 25, 0); ctx.fillText('W', -25, 0);
  ctx.rotate(wind.a);
  const L = 10 + 12 * wind.s;
  ctx.strokeStyle = '#eadfc4'; ctx.fillStyle = '#eadfc4'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(L, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L + 5, 0); ctx.lineTo(L - 3, -5); ctx.lineTo(L - 3, 5); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#b6ab92'; ctx.font = '11px "Alegreya Sans", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(label, x, y + 48);
}
function fleetIcon(x, y, h, color, size, z) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(h); ctx.scale(1 / z, 1 / z);
  ctx.fillStyle = color; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.5;

  ctx.fillStyle = '#f4ecd6'; ctx.fillRect(-1, -size * 0.7, 3, size * 1.4);
  ctx.restore();
}
function renderMap() {
  const P = G.player, z = mapZoom;

    ctx.beginPath(); ctx.arc(p.x, p.y, 9 / z, 0, TAU); ctx.fill(); ctx.stroke();

    ctx.fillText(p.name, p.x, p.y - 13 / z);

    const lab = f.kind === 'bounty' ? f.captain + ' · ' + fmt(f.reward) : f.name + ' (' + f.ships.length + ')';
    ctx.fillText(lab, f.x, f.y + 14 / z);
  }
  fleetIcon(P.x, P.y, P.h, '#f1d79a', 13, z);
  ctx.fillStyle = '#f1d79a'; ctx.font = (12 / z) + 'px "Alegreya Sans", sans-serif'; ctx.textBaseline = 'top';
  ctx.fillText('Your fleet', P.x, P.y + 16 / z);
  ctx.restore();
  drawWindRose(W - 54, 96, G.wind, 'Wind ' + ['light', 'moderate', 'fresh', 'strong'][Math.min(3, Math.floor(G.wind.s * 4))]);
  if (G.paused) { ctx.fillStyle = 'rgba(234,223,196,.9)'; ctx.font = '28px "IM Fell English SC", Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Becalmed (paused) · Space to resume', W / 2, H / 2 - 80); }

}

  const html = s('Day', G.day) + s('Coin', fmt(G.credits)) + s('Provisions', Math.floor(G.cargo.prov) + ' <span class="sub">(' + Math.floor(G.cargo.prov / Math.max(0.1, upkeep())) + 'd)</span>') +

function portPrice(p, gid) { const g = GOODS.find(x => x.id === gid); return Math.max(1, Math.round(g.base * p.mod[gid] * (1 + p.drift[gid]))); }
function buyPrice(p, gid) { return Math.ceil(portPrice(p, gid) * (p.haven ? 1.12 : 1.06) * (G.rep < 0 && !p.haven ? 1 + Math.min(0.2, -G.rep / 150) : 1)); }

function repairCost(s) { return Math.ceil((1 - s.hullFrac) * HULLS[s.type].price * 0.22); }
function sellShipValue(s) { return Math.floor(HULLS[s.type].price * 0.45 * (0.4 + 0.6 * s.hullFrac)); }
function shipPrice(p, t) { return Math.round(HULLS[t].price * (p.haven ? 0.9 : 1)); }

}

  for (const sh of C.ships) { if (!sh.alive || sh.escaped) continue; ctx.fillStyle = sh === C.flag ? '#f1d79a' : sh.side ? '#d0644b' : '#86bd8f'; ctx.fillRect(mx + sh.x * k - 2, my + sh.y * k - 2, 4, 4); }
  ctx.strokeStyle = 'rgba(234,223,196,.4)'; ctx.strokeRect(mx + (C.cam.x - W / 2 / z) * k, my + (C.cam.y - H / 2 / z) * k, W / z * k, H / z * k);
  if (C.msgT > 0) { ctx.fillStyle = 'rgba(234,223,196,' + Math.min(1, C.msgT) + ')'; ctx.font = '26px "IM Fell English SC", Georgia, serif'; ctx.textAlign = 'center'; ctx.fillText(C.msg, W / 2, 70); }
  if (C.paused) { ctx.fillStyle = 'rgba(5,18,22,.5)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#eadfc4'; ctx.font = '34px "IM Fell English SC", Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Paused · P to resume', W / 2, H / 2); }
}

/* ============================== input ============================== */
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  keys[e.code] = true;
  if (mode === 'combat' && C) {
    const s = C.flag;
    if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    initAudio();
    if ((e.code === 'KeyW' || e.code === 'ArrowUp') && s) s.throttle = Math.min(3, s.throttle + 1);
    if ((e.code === 'KeyS' || e.code === 'ArrowDown') && s) s.throttle = Math.max(0, s.throttle - 1);
    if (e.code === 'KeyQ') playerFireAtMouse('port');
    if (e.code === 'KeyE') playerFireAtMouse('star');
    if (e.code === 'KeyF') playerFireAtMouse('bow');
    if (e.code === 'Space') playerFireAtMouse();
    if (e.code === 'Digit1') C.order = 'engage';
    if (e.code === 'Digit2') C.order = 'escort';
    if (e.code === 'Digit3') { C.order = 'retreat'; C.msg = 'All ships, withdraw! Make for the southern edge.'; C.msgT = 2.5; }
    if (e.code === 'KeyP' || e.code === 'Escape') C.paused = !C.paused;
    if (e.code === 'Tab') { const mine = C.ships.filter(x => x.side === 0 && x.alive && !x.escaped); if (mine.length > 1) { C.flag = mine[(mine.indexOf(C.flag) + 1) % mine.length]; C.msg = 'You take command of the ' + C.flag.rec.name + '.'; C.msgT = 1.5; } }
  } else if (mode === 'map' && G) {
    if (e.code === 'Space' && !panelOpen) { e.preventDefault(); G.paused = !G.paused; }
    if (e.code === 'Escape' && panelOpen && !lastResultPending()) act('leave', {});
  }
});
function lastResultPending() { return false; }
window.addEventListener('keyup', e => { keys[e.code] = false; });
cvs.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('pointerdown', e => {
  initAudio(); mouse.x = e.clientX; mouse.y = e.clientY;
  if (mode === 'combat' && C) { if (e.pointerType === 'touch') return; if (e.button === 2) playerFireAtMouse('bow'); else playerFireAtMouse(); return; }
  if (mode !== 'map' || panelOpen) return;
  const P = G.player; const wx = (e.clientX - W / 2) / mapZoom + P.x, wy = (e.clientY - H / 2) / mapZoom + P.y;
  P.destPort = null; P.follow = null;
  for (const p of G.ports) if (dist(p.x, p.y, wx, wy) < 26 / mapZoom) { if (dist(p.x, p.y, P.x, P.y) < 70) { openPort(p); return; } P.destPort = p.id; P.tx = p.x; P.ty = p.y; return; }
  for (const f of G.fleets) if (dist(f.x, f.y, wx, wy) < 20 / mapZoom) { P.follow = f.id; P.tx = f.x; P.ty = f.y; toast('Setting a course to intercept the ' + f.name.toLowerCase() + '.'); return; }
  if (landAt(G.islands, wx, wy, 4)) { toast('That is dry land. Pick a point on the water.'); return; }
  P.tx = clamp(wx, 30, MW - 30); P.ty = clamp(wy, 30, MH - 30); G.paused = false;
});
cvs.addEventListener('wheel', e => {
  e.preventDefault(); const f = Math.exp(-e.deltaY * 0.0012);
  if (mode === 'combat' && C) C.zoom = clamp(C.zoom * f, 0.35, 1.6);
  else if (mode === 'map') mapZoom = clamp(mapZoom * f, 0.25, 1.4);
}, { passive: false });
document.querySelectorAll('#touch button').forEach(b => {
  const t = b.dataset.t;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio(); if (!C) return; const s = C.flag;
    if (t === 'left' || t === 'right') touchHeld[t] = true;
    if (t === 'up' && s) s.throttle = Math.min(3, s.throttle + 1);
    if (t === 'down' && s) s.throttle = Math.max(0, s.throttle - 1);
    if (t === 'port' && s) fireSide(s, -1, null);
    if (t === 'star' && s) fireSide(s, 1, null);
    if (t === 'bow' && s) fireBow(s, null);
    if (t === 'o1') C.order = 'engage'; if (t === 'o2') C.order = 'escort'; if (t === 'o3') C.order = 'retreat';
  });
  const up = () => { touchHeld[t] = false; };
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});

/* ============================== loop ============================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; tNow += dt;
  if (mode === 'combat' && C) { updateCombat(dt); if (C) renderCombat(); }
  else if (G && (mode === 'map' || mode === 'over')) { if (mode === 'map') updateMap(dt); renderMap(); }
  else renderTitleBg(dt);
  requestAnimationFrame(frame);
}
function renderTitleBg() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0e3039'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); drawWaves(0, tNow * 12, 1, 0.12); ctx.restore();
}

// Boot. Keeps an in-progress voyage across live page updates.
function start(data) {
  if (data && data.G) { G = data.G; mode = 'map'; $('#top').hidden = false; closePanel(); toast('The chart has been redrawn. Your voyage continues.'); }
  else showTitle();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => (G && mode !== 'title' && mode !== 'over') ? { G } : {});
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
